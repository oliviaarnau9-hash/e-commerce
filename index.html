<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Hiper-personalización E-commerce</title>
    <style>
        body {
            background-color: #000000;
            color: #ededed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px;
        }
        h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 8px; }
        p { color: #888888; margin-bottom: 30px; }
        
        /* Estilo limpio para la tabla */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #0a0a0a;
            border: 1px solid #222222;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #222222;
            font-size: 0.9rem;
        }
        th {
            background-color: #111111;
            color: #ffffff;
            font-weight: 600;
        }
        tr:hover { background-color: #141414; }
    </style>
</head>
<body>

    <h1>⚡ Radar de Hiper-personalización en E-commerce</h1>
    <p>Monitoreo estratégico conectado en tiempo real con Google Sheets.</p>

    <!-- Contenedor donde aparecerá la tabla de datos -->
    <div id="tabla-tendencias">Cargando datos en vivo desde Google Sheets...</div>

    <script>
        // TU ENLACE CSV DE GOOGLE SHEETS
        const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/10LCH3uyunuLZBl0cAbk-GfTKP7pwHxB4hTMev2nL-mE/edit?usp=sharing";

        async function cargarGoogleSheet() {
            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                
                // Procesamos las líneas del CSV
                const filas = data.split('\n').map(row => {
                    // Manejo básico de comillas del CSV
                    return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                });

                let html = '<table>';
                filas.forEach((fila, index) => {
                    if (fila.length > 1 && fila[0].trim() !== "") {
                        html += '<tr>';
                        fila.forEach(celda => {
                            // Limpiamos comillas extra de las celdas
                            let valorLimpio = celda.replace(/^"|"$/g, '').trim();
                            const tipoTag = index === 0 ? 'th' : 'td';
                            html += `<${tipoTag}>${valorLimpio}</${tipoTag}>`;
                        });
                        html += '</tr>';
                    }
                });
                html += '</table>';

                document.getElementById('tabla-tendencias').innerHTML = html;
            } catch (error) {
                console.error("Error al conectar:", error);
                document.getElementById('tabla-tendencias').innerHTML = "No se pudo cargar la información de la planilla.";
            }
        }

        cargarGoogleSheet();
    </script>
</body>
</html>
